plugins { id 'com.android.application' }
android {
    namespace 'com.buwuzhengdou.lucky'
    compileSdk 36
    defaultConfig {
        applicationId 'com.buwuzhengdou.lucky'
        minSdk 26
        targetSdk 36
        versionCode 120
        versionName '1.2.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    buildFeatures { buildConfig true }
    signingConfigs {
        release {
            def signingFile = new File(System.getProperty('user.home'), '.codex/app-signing/buwuzhengdou/signing.properties')
            if (signingFile.exists()) {
                def p = new Properties(); signingFile.withInputStream { p.load(it) }
                storeFile file(p['storeFile']); storePassword p['storePassword']; keyAlias p['keyAlias']; keyPassword p['keyPassword']
            }
        }
    }
    buildTypes {
        release { signingConfig signingConfigs.release; minifyEnabled false }
        debug { applicationIdSuffix '.debug'; versionNameSuffix '-debug' }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test:core:1.7.0'
    androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.3.0'
}
